{% load static %}
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neue_Berechtigungsname</title>
    <link rel="stylesheet" type="text/css" href="{% static 'Neue_Berechtigungsname/Neue_Berechtigungsname.css' %}">
</head>
<body>

  <div class="form-container">
    <div class="change-group-form" id="changeGroupForm">

        {# Rendere Django messages sichtbar #}
        {% if messages %}
          <div class="messages">
            {% for message in messages %}
              <div class="message {{ message.tags }}">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}

        <form method="post">
          {% csrf_token %}

          <label for="accessLevelInput">Berechtigungsgruppe:</label>
          <input class="accessLevelInput"
            list="accessLevelOptions"
            id="accessLevelInput"
            name="accessLevelInput"
            placeholder="Berechtigungsgruppe eingeben oder auswählen"
            autocomplete="off"
            value="{% if access_levels and access_levels.name %}{{ access_levels.name }}{% endif %}">

          <input type="hidden"
            id="access_level_id"
            name="access_level_id"
            value="{% if access_levels and access_levels.0.id %}{{ access_levels.0.id }}{% endif %}">
          <datalist class="accessLevelOptions" aria-hidden="true" id="accessLevelOptions">
            {% for level in access_levels %}
              <option value="{{ level.name }}" data-id="{{ level.id }}"></option>
            {% endfor %}
          </datalist>

          <label for="newAccessLevel">Neuer Berechtigungsname:</label>
          <input class="newAccessLevel" type="text" id="newAccessLevel" name="newAccessLevel" placeholder="Neuer Berechtigungsname eingeben">
          <button type="submit" class="speichen" id="enderungspeichen">Änderungen speichern</button>
        </form>
    </div>
  </div>

  <div>
    {% if abbrechen %}
      {% for a in abbrechen %}
        <button class="verlassen" onclick="window.location.href='{% url a.url_name %}'">
          {{ a.title }}
        </button>
      {% endfor %}
    {% endif %}
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.querySelector("form");
      if (!form) return;

      const input = document.getElementById("accessLevelInput");
      const datalist = document.getElementById("accessLevelOptions");
      const hiddenId = document.getElementById("access_level_id");

      function syncHiddenIdFromInput() {
        if (!input || !datalist || !hiddenId) return;
        const val = (input.value || "").trim();
        const option = Array.from(datalist.options).find(o => (o.value || "").trim() === val);
        if (option && option.dataset && option.dataset.id) {
          hiddenId.value = option.dataset.id;
        } else {
          hiddenId.value = "";
        }
      }

      input?.addEventListener("input", syncHiddenIdFromInput);
      input?.addEventListener("change", syncHiddenIdFromInput);
      input?.addEventListener("blur", syncHiddenIdFromInput);
      input?.addEventListener("focus", syncHiddenIdFromInput);

      form.addEventListener("submit", (ev) => {
        syncHiddenIdFromInput();

        let oldName = "";
        const select = document.getElementById("accessLevelSelect");
        if (select) {
          oldName = select.options[select.selectedIndex]?.text || "";
        } else if (input) {
          oldName = input.value || "";
        }

        const levelId = hiddenId ? hiddenId.value : "";
        const newNameEl = document.getElementById("newAccessLevel");
        const newName = newNameEl ? newNameEl.value.trim() : "";

        if (!oldName) {
          ev.preventDefault();
          alert("Bitte wählen Sie zuerst eine Berechtigungsgruppe aus.");
          (input || select || newNameEl)?.focus();
          return;
        }
        if (!newName) {
          ev.preventDefault();
          alert("Bitte geben Sie einen neuen Namen ein.");
          newNameEl?.focus();
          return;
        }

        const msgParts = [
          `Alte Berechtigungsgruppename: "${oldName}"`,
          levelId ? `ID: ${levelId}` : null,
          `Neuer Berechtigungsgruppename: "${newName}"`,
          "",
          "Möchten Sie den alten Namen durch den neuen Namen ersetzen?"
        ].filter(Boolean);
        const confirmText = msgParts.join("\n");
        const ok = confirm(confirmText);
        if (!ok) {
          ev.preventDefault();
          newNameEl?.focus();
          return;
        }
      });
    });
  </script>
</body>
</html>
