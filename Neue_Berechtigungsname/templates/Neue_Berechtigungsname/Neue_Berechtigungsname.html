<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <!-- <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> -->
    <title>Neue_Berechtigungsname</title>
    <link rel="stylesheet" type="text/css" href="{% static 'Neue_Berechtigungsname/Neue_Berechtigungsname.css' %}">
    <!-- <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="form-container">
    <div class="change-group-form" id="changeGroupForm">
        <label for="accessLevelInput">Berechtigungsgruppe:</label>
        <input list="accessLevelOptions" id="accessLevelInput" placeholder="Berechtigungsgruppe eingeben oder auswählen">
        <datalist id="accessLevelOptions"></datalist>

        <label for="newAccessLevel">Neuer Berechtigungsname:</label>
        <input type="text" id="newAccessLevel" placeholder="Neuer Berechtigungsname eingeben">
        <button class="speichen" id="enderungspeichen">Änderungen speichern</button>
    </div>
  </div>

  <div>
    {% for a in abbrechen %}
    <button class="verlassen" onclick="window.location.href='{% url a.url_name %}'">
      {{ a.title }}</button>
    {% endfor %}
  </div>


  <!-- test -->
  <div id="debugOutput" style="margin-top: 20px; padding: 10px; background: #f0f0f0; font-family: monospace;">
    <strong>Geladene Namen:</strong>
    <pre id="debugText">noch nichts geladen...</pre>
  </div>
  

  <script>
    function loadAutocompleteOptions(type, datalistId) {
      fetch(`/get_filter_options?type=${type}`)
        .then(response => response.json())
        .then(options => {
          // Debug-Ausgabe auf Seite
          document.getElementById("debugText").textContent = JSON.stringify(options, null, 2);
    
          const datalist = document.getElementById(datalistId);
          if (!datalist) {
            console.warn("Datalist-Element nicht gefunden:", datalistId);
            return;
          }
    
          datalist.innerHTML = "";
          if (Array.isArray(options)) {
            options.forEach(opt => {
              const option = document.createElement("option");
              option.value = opt;
              datalist.appendChild(option);
            });
          }
        })
        .catch(err => {
          document.getElementById("debugText").textContent = "Fehler: " + err;
          console.error(err);
        });
    }
    
    document.addEventListener("DOMContentLoaded", function() {
      loadAutocompleteOptions("accesslevels", "accessLevelOptions");
    });
    </script>
